name: Test

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run tests
        run: BUN_UPDATE_SNAPSHOTS=1 bun test
      - name: Build package
        run: bun run build
      - name: Typecheck
        run: bunx tsc --noEmit
